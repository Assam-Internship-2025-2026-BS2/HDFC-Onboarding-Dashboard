name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
    
      # 1. Checkout code
    
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Set up Node.js
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      
      # 3. Install dependencies
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      
      # 4. Build React app with production env vars
      
      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://dugkfqqpvqc7l.cloudfront.net/api

      
      # 5. Verify build output
      
      - name: Verify build output
        working-directory: frontend
        run: |
          echo "Build contents:"
          ls -la dist/
          echo "Verifying API URL in build:"
          grep -r "dugkfqqpvqc7l" dist/assets/*.js --include="*.js" -l && \
            echo "Correct API URL found in build" || \
            echo "WARNING: API URL not found in build"

      
      # 6. Configure AWS credentials
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      
      # 7. Sync dist/ to S3 (delete removed files automatically)
      
      - name: Deploy to S3
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"

          # index.html gets a short cache so updates propagate fast
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      
      # 8. Invalidate CloudFront cache
      
      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "Waiting for invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id $INVALIDATION_ID
          echo "CloudFront cache invalidated"

      
      # 9. Confirm deployment
      
      - name: Deployment complete
        run: |
          echo "Frontend deployed successfully"
          echo "URL: https://dugkfqqpvqc7l.cloudfront.net"