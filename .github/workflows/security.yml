name: Security & QA

on:
  workflow_run:
    workflows: ["CI/CD"]  
    types: [completed]
    branches: [main]

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  # JOB 1: Gitleaks — Scan for hardcoded secrets in code/history

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history scan

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks scan and generate reports
        run: |
          set -o pipefail  # ensure pipe exits with gitleaks exit code, not tee's

          # Write banner to text report and stdout simultaneously
          {
            echo ""
            echo "╬══════════════════════════════════════════════════════════════╪"
            echo "║                GITLEAKS SECRET SCAN REPORT                  ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
          } | tee gitleaks-summary.txt

          # Run once: verbose scan to stdout+text, JSON report saved simultaneously.
          # --log-opts=--all scans full git history (fetch-depth: 0 fetches it all).
          GITLEAKS_EXIT=0
          gitleaks detect \
            --source . \
            --log-opts=--all \
            --redact \
            --verbose \
            --no-color \
            --report-format json \
            --report-path gitleaks-report.json \
            2>&1 | tee -a gitleaks-summary.txt || GITLEAKS_EXIT=$?

          # Append result box to text report and stdout
          {
            echo ""
            if [ "$GITLEAKS_EXIT" != "0" ]; then
              echo "┌──────────────────────────────────────────┐"
              echo "│    SECRETS FOUND — Review required       │"
              echo "└──────────────────────────────────────────┘"
            else
              echo "┌──────────────────────────────────────────┐"
              echo "│    No secrets detected                   │"
              echo "└──────────────────────────────────────────┘"
            fi
          } | tee -a gitleaks-summary.txt

      - name: Enrich Gitleaks JSON report with metadata
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone

          report_path = "gitleaks-report.json"
          try:
              with open(report_path) as f:
                  findings = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              findings = []

          output = {
              "tool": "gitleaks",
              "version": "8.18.4",
              "run_at": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "summary": {
                  "secrets_found": len(findings)
              },
              "findings": findings
          }

          with open(report_path, "w") as f:
              json.dump(output, f, indent=2)

          print(f"JSON report written: {len(findings)} finding(s)")
          EOF

      - name: Upload Gitleaks reports (text + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: |
            gitleaks-summary.txt
            gitleaks-report.json
          retention-days: 30


  # JOB 2: Trivy Image Scan — CVEs in Docker image

  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest backend image from ECR
        run: |
          docker pull \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:backend-latest

      - name: Run Trivy image scan and generate reports
        run: |
          # Write banner to text report and stdout simultaneously
          {
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║                 TRIVY IMAGE SCAN REPORT                     ║"
            echo "║   Scope : CRITICAL & HIGH CVEs (with fixes available)       ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
          } | tee trivy-image-summary.txt

          # Run JSON scan first to derive accurate counts for the summary box
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/reports \
            aquasec/trivy:latest image \
            --format json \
            --exit-code 0 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --no-progress \
            --output /reports/trivy-image-raw.json \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:backend-latest \
            2>/dev/null || true

          # Parse accurate counts from JSON
          read CRITICAL HIGH < <(python3 - <<'PYEOF'
          import json
          try:
              with open("trivy-image-raw.json") as f:
                  raw = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              raw = {}
          results = raw.get("Results", [])
          c = sum(1 for r in results for v in r.get("Vulnerabilities") or [] if v.get("Severity") == "CRITICAL")
          h = sum(1 for r in results for v in r.get("Vulnerabilities") or [] if v.get("Severity") == "HIGH")
          print(c, h)
          PYEOF
          )

          # Run table scan — stream to stdout and append to text report
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --exit-code 0 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --no-progress \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:backend-latest \
            2>&1 | tee -a trivy-image-summary.txt

          # Append summary box using JSON-derived counts
          {
            echo ""
            echo "┌──────────────────────────────────────────┐"
            echo "│  IMAGE SCAN SUMMARY                      │"
            printf "│  %-20s %-19s│\n" "CRITICAL CVEs:" "$CRITICAL"
            printf "│  %-20s %-19s│\n" "HIGH CVEs:"     "$HIGH"
            echo "└──────────────────────────────────────────┘"
          } | tee -a trivy-image-summary.txt

      - name: Enrich Trivy image JSON report with metadata
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone

          try:
              with open("trivy-image-raw.json") as f:
                  raw = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              raw = {}

          results = raw.get("Results", [])
          total_critical = sum(
              1 for r in results for v in r.get("Vulnerabilities") or []
              if v.get("Severity") == "CRITICAL"
          )
          total_high = sum(
              1 for r in results for v in r.get("Vulnerabilities") or []
              if v.get("Severity") == "HIGH"
          )

          output = {
              "tool": "trivy",
              "scan_type": "image",
              "version": raw.get("SchemaVersion", ""),
              "run_at": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "image": raw.get("ArtifactName", ""),
              "summary": {
                  "critical_cves": total_critical,
                  "high_cves": total_high,
                  "total_cves": total_critical + total_high
              },
              "results": results
          }

          with open("trivy-image-report.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"JSON report written: {total_critical} CRITICAL, {total_high} HIGH")
          EOF

      - name: Upload Trivy image scan reports (text + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-image-summary.txt
            trivy-image-report.json
          retention-days: 30


  
  # JOB 3: Trivy Filesystem Scan — vulnerabilities in source code
  
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan and generate reports
        run: |
          # Write banner to text report and stdout simultaneously
          {
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║               TRIVY FILESYSTEM SCAN REPORT                  ║"
            echo "║   Scope : Vulns + Secrets + Misconfigs (CRITICAL & HIGH)    ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
          } | tee trivy-fs-summary.txt

          # Run JSON scan first to derive accurate counts for the summary box
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:latest fs \
            --format json \
            --exit-code 0 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --scanners vuln,secret,misconfig \
            --no-progress \
            --output /workspace/trivy-fs-raw.json \
            /workspace \
            2>/dev/null || true

          # Parse accurate counts from JSON — not from grepping the text output
          read CRITICAL HIGH SECRETS MISCONFIG < <(python3 - <<'PYEOF'
          import json
          try:
              with open("trivy-fs-raw.json") as f:
                  raw = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              raw = {}
          results = raw.get("Results", [])
          c = sum(1 for r in results for v in r.get("Vulnerabilities") or [] if v.get("Severity") == "CRITICAL")
          h = sum(1 for r in results for v in r.get("Vulnerabilities") or [] if v.get("Severity") == "HIGH")
          s = sum(len(r.get("Secrets") or []) for r in results)
          m = sum(len(r.get("Misconfigurations") or []) for r in results)
          print(c, h, s, m)
          PYEOF
          )

          # Run table scan — stream to stdout and append to text report
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:latest fs \
            --format table \
            --exit-code 0 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --scanners vuln,secret,misconfig \
            --no-progress \
            /workspace \
            2>&1 | tee -a trivy-fs-summary.txt

          # Append summary box using JSON-derived counts (not grep)
          {
            echo ""
            echo "┌──────────────────────────────────────────┐"
            echo "│  FILESYSTEM SCAN SUMMARY                 │"
            printf "│  %-20s %-19s│\n" "CRITICAL CVEs:"     "$CRITICAL"
            printf "│  %-20s %-19s│\n" "HIGH CVEs:"         "$HIGH"
            printf "│  %-20s %-19s│\n" "Secrets found:"     "$SECRETS"
            printf "│  %-20s %-19s│\n" "Misconfigurations:" "$MISCONFIG"
            echo "└──────────────────────────────────────────┘"
          } | tee -a trivy-fs-summary.txt

      - name: Enrich Trivy filesystem JSON report with metadata
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone

          try:
              with open("trivy-fs-raw.json") as f:
                  raw = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              raw = {}

          results = raw.get("Results", [])
          total_critical = sum(
              1 for r in results for v in r.get("Vulnerabilities") or []
              if v.get("Severity") == "CRITICAL"
          )
          total_high = sum(
              1 for r in results for v in r.get("Vulnerabilities") or []
              if v.get("Severity") == "HIGH"
          )
          total_secrets    = sum(len(r.get("Secrets")           or []) for r in results)
          total_misconfigs = sum(len(r.get("Misconfigurations") or []) for r in results)

          output = {
              "tool": "trivy",
              "scan_type": "filesystem",
              "version": raw.get("SchemaVersion", ""),
              "run_at": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "summary": {
                  "critical_cves":     total_critical,
                  "high_cves":         total_high,
                  "total_cves":        total_critical + total_high,
                  "secrets_found":     total_secrets,
                  "misconfigurations": total_misconfigs
              },
              "results": results
          }

          with open("trivy-fs-report.json", "w") as f:
              json.dump(output, f, indent=2)

          print(
              f"JSON report written: {total_critical} CRITICAL, {total_high} HIGH, "
              f"{total_secrets} secrets, {total_misconfigs} misconfigs"
          )
          EOF

      - name: Upload Trivy filesystem scan reports (text + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-reports
          path: |
            trivy-fs-summary.txt
            trivy-fs-report.json
          retention-days: 30


  # JOB 4: SonarQube Community — code quality + security analysis

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start SonarQube Community
        run: |
          docker run -d \
            --name sonarqube \
            -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community

          echo "Waiting for SonarQube to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:9000/api/system/status || echo "000")
            if [ "$STATUS" = "200" ]; then
              HEALTH=$(curl -s http://localhost:9000/api/system/status \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
              if [ "$HEALTH" = "UP" ]; then
                echo "SonarQube is UP"
                break
              fi
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done

      - name: Generate SonarQube token
        id: sonar-token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=github-actions-$(date +%s)" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "::add-mask::$TOKEN"

      - name: Install Sonar Scanner
        run: |
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.1.0.4477-linux-x64.zip
          unzip -q sonar-scanner-cli-6.1.0.4477-linux-x64.zip
          echo "$(pwd)/sonar-scanner-6.1.0.4477-linux-x64/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt --break-system-packages || true

      - name: Run SonarQube analysis and generate reports
        run: |
          # ── Run scanner ──────────────────────────────────────────────────────
          sonar-scanner \
            -Dsonar.projectKey=hdfc-onboarding-dashboard \
            -Dsonar.projectName="HDFC Onboarding Dashboard" \
            -Dsonar.sources=backend,frontend/src \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/__pycache__/**" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=${{ steps.sonar-token.outputs.token }} \
            -Dsonar.python.version=3

          # ── Wait for the Compute Engine task to finish ────────────────────────
          # (a fixed sleep is unreliable — large repos can take longer than 20 s)
          echo "Waiting for SonarQube analysis to complete..."
          for i in $(seq 1 30); do
            CE_STATUS=$(curl -s -u admin:admin \
              "http://localhost:9000/api/ce/activity?projectKey=hdfc-onboarding-dashboard&ps=1" \
              | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          tasks = data.get('tasks', [])
          print(tasks[0].get('status', 'PENDING') if tasks else 'PENDING')
            ")
            if [ "$CE_STATUS" = "SUCCESS" ] || [ "$CE_STATUS" = "FAILED" ] || [ "$CE_STATUS" = "CANCELLED" ]; then
              echo "Analysis task status: $CE_STATUS"
              break
            fi
            echo "Attempt $i/30 — task status: $CE_STATUS — waiting 10s..."
            sleep 10
          done

          # ── Fetch all API data once, then write sonar-raw.json + sonar-summary.txt
          python3 - <<'EOF'
          import json, subprocess, time

          BASE_URL    = "http://localhost:9000"
          AUTH        = ("admin", "admin")
          PROJECT     = "hdfc-onboarding-dashboard"
          PAGE_SIZE   = 500    # SonarQube maximum page size
          MAX_RESULTS = 10000  # SonarQube hard cap: p * ps <= 10,000

          def curl_json(url):
              """Fetch a SonarQube API endpoint and return parsed JSON."""
              result = subprocess.run(
                  ["curl", "-s", "-u", f"{AUTH[0]}:{AUTH[1]}", url],
                  capture_output=True, text=True
              )
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  return {}

          # ── Quality gate ──────────────────────────────────────────────────────
          qg_data       = curl_json(
              f"{BASE_URL}/api/qualitygates/project_status?projectKey={PROJECT}"
          )
          quality_gate  = qg_data.get("projectStatus", {}).get("status", "UNKNOWN")
          qg_conditions = qg_data.get("projectStatus", {}).get("conditions", [])

          # ── Severity summary (single facets request) ──────────────────────────
          facet_data  = curl_json(
              f"{BASE_URL}/api/issues/search"
              f"?projectKeys={PROJECT}&resolved=false&facets=severities&ps=1"
          )
          facets      = {f["property"]: f["values"] for f in facet_data.get("facets", [])}
          severities  = {v["val"]: v["count"] for v in facets.get("severities", [])}
          grand_total = facet_data.get("total", 0)

          # ── First-20 CRITICAL/MAJOR issues for the text-report preview ────────
          preview_data   = curl_json(
              f"{BASE_URL}/api/issues/search"
              f"?projectKeys={PROJECT}&severities=CRITICAL,MAJOR&resolved=false&ps=20"
          )
          preview_issues = preview_data.get("issues", [])

          # ── Paginated collection of all issues ────────────────────────────────
          # SonarQube enforces: p * ps <= 10,000.
          # With ps=500 the highest reachable page is 20 (500 × 20 = 10,000).
          all_issues = []
          page       = 1
          max_page   = MAX_RESULTS // PAGE_SIZE  # = 20

          print(
              f"Collecting issues for '{PROJECT}' "
              f"(ps={PAGE_SIZE}, hard cap={MAX_RESULTS}, max_page={max_page}) ..."
          )

          while page <= max_page:
              data         = curl_json(
                  f"{BASE_URL}/api/issues/search"
                  f"?projectKeys={PROJECT}"
                  f"&resolved=false"
                  f"&ps={PAGE_SIZE}"
                  f"&p={page}"
              )
              page_issues  = data.get("issues", [])
              server_total = data.get("total", 0)

              if not page_issues:
                  print(f"  Page {page}: empty response — collection complete.")
                  break

              all_issues.extend(page_issues)
              collected = len(all_issues)
              print(
                  f"  Page {page:>3}/{max_page}: "
                  f"+{len(page_issues):>4} issues  |  "
                  f"collected {collected:>5} / reported {server_total}"
              )

              if collected >= server_total:
                  print(f"  All {server_total} issues collected.")
                  break

              if (page + 1) * PAGE_SIZE > MAX_RESULTS:
                  print(
                      f"  Next page would exceed the 10,000-result cap "
                      f"— stopping at {collected} issues."
                  )
                  break

              page += 1
              time.sleep(0.2)  # be polite to the local instance

          print(f"Pagination complete. Total issues collected: {len(all_issues)}")

          # ── Write sonar-raw.json ───────────────────────────────────────────────
          raw_output = {
              "quality_gate":    {"status": quality_gate, "conditions": qg_conditions},
              "severity_counts": severities,
              "grand_total":     grand_total,
              "all_issues":      all_issues,
              "preview_issues":  preview_issues,
          }
          with open("sonar-raw.json", "w") as f:
              json.dump(raw_output, f, indent=2)

          # ── Write sonar-summary.txt ───────────────────────────────────────────
          CRITICAL = severities.get("CRITICAL", 0)
          MAJOR    = severities.get("MAJOR",    0)
          MINOR    = severities.get("MINOR",    0)
          INFO     = severities.get("INFO",     0)
          TOTAL    = grand_total

          lines = [
              "",
              "╔══════════════════════════════════════════════════════════════╗",
              "║                SONARQUBE ANALYSIS REPORT                    ║",
              "╠══════════════════════════════════════════════════════════════╣",
              f"║  Quality Gate :  {'PASSED' if quality_gate == 'OK' else quality_gate:<43}║",
              "╠══════════════════════════════════════════════════════════════╣",
              "║  ISSUE SUMMARY                                               ║",
              f"║  {'CRITICAL:':<20} {str(CRITICAL):<39}║",
              f"║  {'MAJOR:':<20} {str(MAJOR):<39}║",
              f"║  {'MINOR:':<20} {str(MINOR):<39}║",
              f"║  {'INFO:':<20} {str(INFO):<39}║",
              f"║  {'TOTAL:':<20} {str(TOTAL):<39}║",
              "╠══════════════════════════════════════════════════════════════╣",
              "║  CRITICAL & MAJOR ISSUES (first 20 — see JSON for all)       ║",
              "╚══════════════════════════════════════════════════════════════╝",
              "",
          ]

          if not preview_issues:
              lines.append("No CRITICAL or MAJOR issues found.")
          else:
              lines.append(f"{'SEVERITY':<12} {'TYPE':<20} {'FILE':<35} {'LINE':<6} MESSAGE")
              lines.append("-" * 110)
              for i in preview_issues:
                  comp = i.get("component", "").split(":")[-1][-35:]
                  msg  = i.get("message", "")[:55]
                  line = str(i.get("line", "?"))
                  lines.append(
                      f"{i.get('severity',''):<12} {i.get('type',''):<20} {comp:<35} {line:<6} {msg}"
                  )

          lines.append("")
          report_text = "\n".join(lines)
          print(report_text)

          with open("sonar-summary.txt", "w") as f:
              f.write(report_text)

          print("Reports generated: sonar-summary.txt and sonar-raw.json")
          EOF

      - name: Enrich SonarQube JSON report with metadata
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone

          PROJECT     = "hdfc-onboarding-dashboard"
          MAX_RESULTS = 10000  # SonarQube hard cap: p * ps <= 10,000

          try:
              with open("sonar-raw.json") as f:
                  raw = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              raw = {}

          quality_gate  = raw.get("quality_gate", {}).get("status", "UNKNOWN")
          qg_conditions = raw.get("quality_gate", {}).get("conditions", [])
          severities    = raw.get("severity_counts", {})
          grand_total   = raw.get("grand_total", 0)
          all_issues    = raw.get("all_issues", [])

          # Normalise fields for consistent downstream consumption
          normalised = [
              {
                  "key":           i.get("key"),
                  "severity":      i.get("severity"),
                  "type":          i.get("type"),
                  "component":     i.get("component", "").split(":")[-1],
                  "line":          i.get("line"),
                  "message":       i.get("message"),
                  "rule":          i.get("rule"),
                  "status":        i.get("status"),
                  "creation_date": i.get("creationDate"),
                  "tags":          i.get("tags", []),
                  "debt":          i.get("debt"),
              }
              for i in all_issues
          ]

          output = {
              "tool":        "sonarqube",
              "version":     "community",
              "run_at":      datetime.now(timezone.utc).isoformat(),
              "repository":  os.environ.get("GITHUB_REPOSITORY", ""),
              "ref":         os.environ.get("GITHUB_REF", ""),
              "sha":         os.environ.get("GITHUB_SHA", ""),
              "project_key": PROJECT,
              "quality_gate": {
                  "status":     quality_gate,
                  "conditions": qg_conditions
              },
              "summary": {
                  "critical":        severities.get("CRITICAL", 0),
                  "major":           severities.get("MAJOR",    0),
                  "minor":           severities.get("MINOR",    0),
                  "info":            severities.get("INFO",     0),
                  "total_reported":  grand_total,
                  "total_collected": len(normalised),
                  "capped_at_10k":   grand_total > MAX_RESULTS
              },
              "issues": normalised
          }

          with open("sonar-report.json", "w") as f:
              json.dump(output, f, indent=2)

          print(
              f"sonar-report.json written — "
              f"{len(normalised)} issues collected, "
              f"quality gate: {quality_gate}"
          )
          EOF

      - name: Upload SonarQube reports (text + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-reports
          path: |
            sonar-summary.txt
            sonar-report.json
          retention-days: 30